name: Deploy Laravel (API) e Nuxt (Frontend)

on:
  push:
    branches:
      - 17_github_action # Ajuste se sua branch principal for outra (ex: main)

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Baixar o código (Checkout)
        uses: actions/checkout@v4

      - name: 2. Configurar o Node.js (para o build do Nuxt)
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: 3. Instalar dependências e Build (Nuxt)
        working-directory: ./frontend
        run: |
          npm install
          npm run build # Gera a pasta .output

      # --- ETAPA DE DEPLOY 1: O BACKEND LARAVEL ---
      - name: 4. Copiar arquivos do Backend (Laravel) para public_html
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOSTINGER_SFTP_HOST }}
          username: ${{ secrets.HOSTINGER_SFTP_USERNAME }}
          password: ${{ secrets.HOSTINGER_SFTP_PASSWORD }}
          port: 65002

          # 'source' copterá TUDO, exceto o que o .gitignore padrão exclui
          source: "."

          # 'target' é a raiz do seu Laravel no servidor
          target: "public_html"

          # Esta flag é importante: apaga arquivos antigos do servidor
          # que não existem mais no seu repositório.
          rm: true

      # --- ETAPA DE DEPLOY 2: O FRONTEND NUXT ---
      - name: 5. Copiar arquivos do Frontend (Build Nuxt) para public_html/public
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOSTINGER_SFTP_HOST }}
          username: ${{ secrets.HOSTINGER_SFTP_USERNAME }}
          password: ${{ secrets.HOSTINGER_SFTP_PASSWORD }}
          port: 65002

          # 'source' é o resultado do build do Nuxt
          source: "./frontend/.output/public/."

          # 'target' é a pasta pública do Laravel
          target: "public_html/public"

          # 'rm: true' aqui garante que o 'index.php' antigo do Laravel
          # seja apagado de 'public' e substituído pelo 'index.html' do Nuxt.
          rm: true
