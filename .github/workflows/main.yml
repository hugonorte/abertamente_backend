name: Deploy Frontend to Hostinger

on:
  push:
    branches:
      - 17_github_action # ATENÇÃO: Mude para 'master' se for o nome da sua branch principal

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Baixar o código (Checkout)
        uses: actions/checkout@v4

      # Adicionado 'working-directory' para o cache do npm funcionar no diretório correto
      - name: 2. Configurar o Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json # Caminho para o lock file

      # Adicionado 'working-directory' para rodar os comandos na pasta /frontend
      - name: 3. Instalar dependências e Build
        working-directory: ./frontend
        run: |
          npm install
          npm run build # Se for Nuxt, este comando geralmente cria a pasta .output

      # Alterado 'local-dir' para apontar para a pasta de build DENTRO de /frontend
      - name: 4. Fazer o deploy para a Hostinger via SFTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.HOSTINGER_SFTP_HOST }}
          username: ${{ secrets.HOSTINGER_SFTP_USERNAME }}
          password: ${{ secrets.HOSTINGER_SFTP_PASSWORD }}
          protocol: ftps
          port: 65002 # Porta SFTP padrão da Hostinger

          # --- ATENÇÃO AQUI ----
          # O build do Nuxt 3 (npm run build) gera a pasta '.output/public'
          # Se você rodou 'npm run generate', a pasta pode ser 'dist'
          # Ajuste conforme o seu caso.
          local-dir: ./frontend/.output/public/ # Caminho padrão do Nuxt 3
          # local-dir: ./frontend/dist/ # Descomente se você gera uma pasta 'dist'
          server-dir: public_html/
          timeout: 60000
