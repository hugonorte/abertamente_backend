name: Deploy to Hostinger

on:
  push:
    branches:
      - 17_github_action

jobs:
  deploy:
    name: Sync files to public_html
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Ação de deploy rsync ATUALIZADA
      - name: Sync directories to Hostinger
        uses: burnett01/rsync-deployments@7.0.2  # <--- Esta é a nova action
        with:
          # A flag '-rvz --delete' é o equivalente ao 'args' que você usava
          # -r (recursivo), -v (verboso), -z (comprimir), --delete (apaga arquivos órfãos)
          switches: -rvz --delete

          # O caminho de origem (as pastas do seu projeto)
          path: |
            app/
            bootstrap/
            config/
            database/
            public/
            routes/
            composer.json
            composer.lock

          # Credenciais do servidor (use remote_key para Chave SSH, é mais seguro)
          remote_host: ${{ secrets.HOSTINGER_SFTP_HOST }}
          remote_user: ${{ secrets.HOSTINGER_SFTP_USERNAME }}
          remote_key: ${{ secrets.HOSTINGER_SSH_KEY }} # <--- Recomendado
          # remote_password: ${{ secrets.HOSTINGER_SFTP_PASSWORD }} # Use chave ou senha
          remote_port: 65002

          # O caminho de destino no servidor (estava correto)
          remote_path: "/home/u424791251/domains/admin.abertamente.net/public_html"
