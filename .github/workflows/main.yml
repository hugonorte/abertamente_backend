name: Deploy Frontend via SSH (Hostinger)

on:
  push:
    branches:
      - 17_github_action # Ajuste se sua branch principal for outra (ex: main)

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Baixar o código (Checkout)
        uses: actions/checkout@v4

      - name: 2. Configurar o Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      # Este passo é do seu YML anterior e é essencial
      - name: 3. Instalar dependências e Build (Nuxt)
        working-directory: ./frontend
        run: |
          npm install
          npm run build

      # Este passo é do exemplo da Hostinger, adaptado
      - name: 4. Copiar arquivos para Hostinger (via SFTP/SCP)
        uses: appleboy/scp-action@v0.1.7
        with:
          # ATENÇÃO: Os nomes dos secrets mudaram!
          host: ${{ secrets.HOSTINGER_SFTP_HOST }}
          username: ${{ secrets.HOSTINGER_SFTP_USERNAME }}
          password: ${{ secrets.HOSTINGER_SFTP_PASSWORD }}
          port: 65002

          # MUDANÇA: Aponta para o resultado do build do Nuxt
          # O './.' no final copia o *conteúdo* da pasta, não a pasta em si.
          source: "./frontend/.output/public/."

          # MUDANÇA: O destino no servidor
          target: "public_html/"

      # REMOVIDO: O passo 'Run composer install' foi removido
      # pois ele é específico para projetos PHP/Laravel.
