name: Deploy Laravel + Nuxt via SSH (Hostinger)

on:
  push:
    branches:
      - 17_github_action # Ajuste se sua branch principal for outra (ex: main)

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Baixar o código (Checkout)
        uses: actions/checkout@v4
        # Baixa o repositório inteiro para o runner do GitHub

      # REMOVIDO: Os passos de 'npm install' e 'npm run build' locais
      # Eles não são necessários, pois faremos isso no servidor.

      - name: 2. Copiar TUDO para Hostinger (via SFTP/SCP)
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOSTINGER_SFTP_HOST }}
          username: ${{ secrets.HOSTINGER_SFTP_USERNAME }}
          password: ${{ secrets.HOSTINGER_SFTP_PASSWORD }}
          port: 65002

          # --- MUDANÇA PRINCIPAL ---
          # 'source' agora é '.', que significa 'o repositório inteiro'.
          # O './.' no final copia o *conteúdo* da pasta raiz.
          source: "./."

          # 'target' é a pasta 'public_html/'
          target: "public_html/"

          # (Opcional) Adicionar 'rm: true' pode ser útil no futuro
          # para apagar arquivos antigos no servidor que não existem mais no repo.
          # rm: true

      - name: 3. Executar Comandos de Build no Servidor (via SSH)
        # Este passo é crucial: ele instala as dependências no seu servidor
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOSTINGER_SFTP_HOST }}
          username: ${{ secrets.HOSTINGER_SFTP_USERNAME }}
          password: ${{ secrets.HOSTINGER_SFTP_PASSWORD }}
          port: 65002

          # Comandos que serão executados na Hostinger
          script: |
            # Entra no diretório onde os arquivos foram copiados
            cd public_html

            echo "--- Instalando dependências do Laravel ---"
            # (Verifique se 'composer' está disponível no seu plano Hostinger)
            composer install --no-interaction --prefer-dist --optimize-autoloader

            # (Adicione outros comandos do Laravel aqui se precisar, ex: migrations)
            # php artisan migrate --force

            echo "--- Instalando dependências do Nuxt ---"
            # Entra na pasta do frontend
            cd frontend
            npm install

            echo "--- Buildando o frontend Nuxt ---"
            npm run build

            echo "--- Deploy concluído ---"
